<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Web App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a4a9e;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { font-size: 2.5rem; margin: 0; color: #00d2ff; }
        p { font-size: 1.2rem; margin-top: 10px; }
        .name { font-weight: bold; font-size: 1.5rem; color: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Scalable Web App</h1>
        <p>Developed by:</p>
        <p class="name">Rose Brijit Abey</p> 
        <p>Status: <span style="color: #00ff88;">● Running on Kubernetes</span></p>
    </div>
</body>
</html>
